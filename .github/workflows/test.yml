name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: snapchat-immich-friends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest pillow
      - name: Unit + end-to-end tests (fake Immich / Google servers)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m pytest -v tests
      - name: Window opens (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -c "import tkinter as tk, gui; r=tk.Tk(); a=gui.App(r); [a.dest.set(d) or a._on_dest_change() or r.update() for d in ('immich','google','icloud','folder')]; r.destroy(); print('window OK, Tk', tk.TkVersion)"
      - name: Window opens (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter as tk, gui; r=tk.Tk(); gui.App(r); r.update(); r.destroy(); print('window OK')"

  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: snapchat-immich-friends
    env:
      SNAPIMPORT_SETUP_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: START-WINDOWS.bat sets up
        if: runner.os == 'Windows'
        shell: cmd
        run: call START-WINDOWS.bat && .venv\Scripts\python.exe -c "import requests, requests_toolbelt, piexif, tkinter"
      - name: START-MAC.command sets up and is executable
        if: runner.os == 'macOS'
        run: |
          test -x START-MAC.command
          ./START-MAC.command
          .venv/bin/python -c "import requests, requests_toolbelt, piexif, tkinter"
